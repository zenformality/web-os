<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZI OS</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="boot-screen">
      <div id="boot-logo">ZI</div>
      <div id="boot-text">Initializing system...</div>
    </div>

  <div id="desktop">
    <div id="desktop-icons"></div>
    <div id="windows-container"></div>
  </div>

    <div id="start-menu">
        <div id="start-menu-header">
            <div>
                <div id="start-menu-name">ZI</div>
                <div id="start-menu-subtitle">visitor@ZI-os:~</div>
            </div>
        </div>
      <input type="text" id="start-menu-search" placeholder="Search apps...">
      <div id="start-menu-apps"></div>
        <div id="start-menu-footer">
          <button id="settings-shortcut">Settings</button>
          <button id="power-shortcut">Power</button>
        </div>
    </div>

  <div id="taskbar">
    <button id="start-btn">Start</button>
    <div id="taskbar-apps"></div>
    <div id="system-tray">
      <span id="clock">--:--</span>
    </div>
  </div>

  <div id="context-menu">
    <div class="ctx-item" data-action="refresh">Refresh</div>
    <div class="ctx-sep"></div>
    <div class="ctx-item" data-action="terminal">Terminal</div>
    <div class="ctx-item" data-action="settings">Settings</div>
    <div class="ctx-item" data-action="about">About</div>
  </div>

  <div id="notification-area"></div>
  <script src="script.js"></script>
</body>
</html>
