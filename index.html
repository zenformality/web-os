<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alex OS</title>

  <!-- Tailwind CSS CDN (global, no Node.js) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Space Grotesk', 'system-ui', 'sans-serif'],
            mono: ['Space Mono', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Boot Screen -->
  <div id="boot-screen">
    <div id="boot-logo">💻</div>
    <div id="boot-text">Initializing system...</div>
  </div>

  <!-- Desktop -->
  <div id="desktop">
    <div id="desktop-icons"></div>
    <div id="windows-container"></div>
  </div>

  <!-- Start Menu -->
  <div id="start-menu">
    <div id="start-menu-header">
      <img src="https://avatars.githubusercontent.com/u/583231?v=4" alt="Avatar" id="start-menu-avatar" />
      <div>
        <div id="start-menu-name">Alex</div>
        <div id="start-menu-subtitle">visitor@alex-os:~</div>
      </div>
    </div>
    <input type="text" id="start-menu-search" placeholder="Search apps..." />
    <div id="start-menu-apps"></div>
    <div id="start-menu-footer">
      <button id="settings-shortcut">⚙️ Settings</button>
      <button id="power-shortcut">⏻ Power</button>
    </div>
  </div>

  <!-- Taskbar -->
  <div id="taskbar">
    <button id="start-btn">⊞ Start</button>
    <div id="taskbar-apps"></div>
    <div id="system-tray">
      <span id="clock">--:-- --</span>
    </div>
  </div>

  <!-- Context Menu -->
  <div id="context-menu">
    <div class="ctx-item" data-action="refresh">🔄 Refresh</div>
    <div class="ctx-separator"></div>
    <div class="ctx-item" data-action="terminal">💻 Open Terminal</div>
    <div class="ctx-item" data-action="settings">⚙️ Settings</div>
    <div class="ctx-item" data-action="about">👤 About</div>
  </div>

  <!-- Notification Area -->
  <div id="notification-area"></div>

  <script src="script.js"></script>
</body>
</html>
